name: CI / Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        # pnpm version is resolved from package.json `packageManager` (pnpm@11.18.0)
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm -r run lint
      - name: Unit tests
        # pnpm -r runs only in packages that define the script; apps/playground
        # and the shared packages without a `test` script are skipped silently.
        run: pnpm -r run test
      - name: Build
        run: pnpm -r run build

  e2e:
    name: Overflow scroll law (both apps)
    # The scroll law ("the page never scrolls horizontally") regresses loudly:
    # both themed overflow matrices (9 viewports × light/dark, 54 checks) run on
    # every push/PR, and the deploy jobs below wait on this job.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright chromium
        # One browser install serves both apps — same locked @playwright/test,
        # shared ms-playwright cache. Each config's webServer boots its own dev
        # server (:3000 landing / :3001 playground) because CI never reuses one.
        run: pnpm --filter @nanisoft/landing exec playwright install --with-deps chromium
      - name: Landing — overflow scroll law
        run: pnpm --filter @nanisoft/landing run test:overflow
      - name: Playground — overflow scroll law
        run: pnpm --filter @nanisoft/playground run test:overflow

  deploy-landing:
    name: Deploy landing → nanisoft worker
    needs: [verify, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and deploy
        # `pnpm --filter` runs the script from apps/landing, so OpenNext reads
        # apps/landing/wrangler.jsonc and deploys worker `nanisoft` (nanisoft.com
        # + www.nanisoft.com), updating the existing worker in place.
        run: pnpm --filter @nanisoft/landing run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-playground:
    name: Deploy playground → nanisoft-playground worker
    needs: [verify, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and deploy
        # Deploys worker `nanisoft-playground`. On the first run this creates
        # the worker; afterwards add the playground.nanisoft.com custom domain
        # + DNS record in the Cloudflare dashboard (one-time, manual).
        run: pnpm --filter @nanisoft/playground run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-docs:
    name: Deploy docs → docs.nanisoft.com (Pages)
    needs: [verify, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build static export
        # Produces apps/docs/out — the static site Cloudflare Pages serves.
        # `cloudflare-build` is `next build --webpack` (Nextra 4.6.1 static
        # export); verify already runs this same build on PRs via
        # `pnpm -r run build`, so PRs gate the docs site before merge.
        run: pnpm --filter @nanisoft/docs run cloudflare-build
      - name: Create Pages project (idempotent)
        # `wrangler pages deploy` errors if the project doesn't exist, so create
        # it first. `|| true` keeps this green on re-runs (wrangler exits non-zero
        # once the project exists); the deploy step below is the real gate. The
        # CLOUDFLARE_API_TOKEN secret must have scope covering Pages:Edit.
        run: pnpm --filter @nanisoft/docs exec wrangler pages project create nanisoft-docs --production-branch main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Cloudflare Pages
        # Deploys apps/docs/out to the nanisoft-docs Pages project. After the
        # first deploy, add the docs.nanisoft.com custom domain + DNS record in
        # the Cloudflare Pages dashboard (one-time, manual).
        run: pnpm --filter @nanisoft/docs run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-blog:
    name: Deploy blog → blog.nanisoft.com (Pages)
    needs: [verify, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build static export
        # Produces apps/blog/out — the static site Cloudflare Pages serves.
        # `cloudflare-build` is `next build --webpack` (Nextra 4.6.1 static
        # export); verify already runs this same build on PRs via
        # `pnpm -r run build`, so PRs gate the blog site before merge.
        run: pnpm --filter @nanisoft/blog run cloudflare-build
      - name: Create Pages project (idempotent)
        # `wrangler pages deploy` errors if the project doesn't exist, so create
        # it first. `|| true` keeps this green on re-runs (wrangler exits non-zero
        # once the project exists); the deploy step below is the real gate. The
        # CLOUDFLARE_API_TOKEN secret must have scope covering Pages:Edit.
        run: pnpm --filter @nanisoft/blog exec wrangler pages project create nanisoft-blog --production-branch main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Cloudflare Pages
        # Deploys apps/blog/out to the nanisoft-blog Pages project. After the
        # first deploy, add the blog.nanisoft.com custom domain + DNS record in
        # the Cloudflare Pages dashboard (one-time, manual).
        run: pnpm --filter @nanisoft/blog run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}